name: Docker Images

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to Docker Hub"
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: cassandra
            context: cassandra
            version: "5.0"
          - name: kafka
            context: kafka
            version: "3.7.0"
          - name: github-runner
            context: github-runner
            version: "2.335.1"
          - name: jupyterlab
            context: jupyterlab
            version: latest
          - name: identity
            context: identity
            version: "7.1.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image.context }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || 'odytrice' }}/${{ matrix.image.name }}:${{ matrix.image.version }}
            ${{ secrets.DOCKER_USERNAME || 'odytrice' }}/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
