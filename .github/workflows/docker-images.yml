name: Docker Images

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to Docker Hub"
        required: true
        default: false
        type: boolean

env:
  DOCKERHUB_NAMESPACE: odytrice

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: cassandra
            context: cassandra
            version: "5.0"
          - name: kafka
            context: kafka
            version: "3.7.0"
          - name: github-runner
            context: github-runner
            version: "2.326"
          - name: jupyterlab
            context: jupyterlab
            version: latest
          - name: identity
            context: identity
            version: "7.1.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.push)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image.context }}
          push: ${{ github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.push) }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image.name }}:${{ matrix.image.version }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
